[package]
name = "tldr"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "tldr"
path = "src/main.rs"

[dependencies]
clap         = { version = "4.5", features = ["derive"] }
reqwest      = { version = "0.12", features = ["blocking"] }
termcolor    = "1.4"
zip          = "2.1"
dirs         = "5.0"
anyhow       = "1.0"
regex        = "1.10"
percent-encoding = "2.3"

[dev-dependencies]
assert_cmd   = "2.0"
predicates   = "3.1"
tempfile     = "3.10"
mockito      = "1.4"
